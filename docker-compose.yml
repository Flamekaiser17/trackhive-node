version: '3.8'

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: trackhive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trackhive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trackhive-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis Cache & Spatial Store ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trackhive-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trackhive-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Node.js Real-time Telemetry & API Engine ────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: trackhive-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/trackhive?schema=public
      - DIRECT_URL=postgresql://postgres:postgrespassword@postgres:5432/trackhive?schema=public
      - REDIS_URL=redis://redis:6379
    networks:
      - trackhive-network

  # ── React 19 Frontend SPA (Nginx) ───────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: trackhive-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - trackhive-network

networks:
  trackhive-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

