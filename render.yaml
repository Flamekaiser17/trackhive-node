services:
  - type: web
    name: trackhive-api
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: "npm install && npx prisma generate"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false

  - type: web
    name: trackhive-frontend
    runtime: static
    rootDir: apps/frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_NODE_URL
        value: "https://trackhive-api.onrender.com"
      - key: VITE_API_URL
        value: "https://trackhive-api.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
